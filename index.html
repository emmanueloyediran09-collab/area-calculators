<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // area of a triangle
        const b=29
        const h=3
        const areaOfTriangle= 0.5 * b * h
        console.log(areaOfTriangle);
        
        //area of square
        const l=29
        const areaOfSquare= l*l
        console.log(areaOfSquare);
        
        
        // area of a circle
        const pie = 3.12
        const r = 2
        const areaOfcircle= pie*(r**2)
        console.log(areaOfcircle);

        //area of quadilateral
        const d1=23
        const d2=13
        const sin45=0.707
        const areaOfQuadilateral=0.5 * d1 * d2 * sin45
        console.log(areaOfQuadilateral);


        //area of rhombus

        const a1=23
        const a2=13
        const areaOfRhombus=0.5 * a1 * a2 
        console.log(areaOfRhombus);

      
        // area of trapezium
         const d=2
        const c=4
        const h1=2
        const areaOfTrapezium=0.5 * (d + c) * h1
        console.log(areaOfTrapezium);

        // area of parallelogram
        const s=3
        const h3=7
        const areaOfParallelogram=s * h3
        console.log(areaOfParallelogram);

        //BMI

        const weightInKg=200
        const heigthInMeter= 10
        const BMI = weightInKg/(heigthInMeter)**2
        console.log(BMI);
        

        
    </script>
</body>
</html>
